name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  # ============================================================
  # macOS - Apple Silicon (aarch64)
  # ============================================================
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Install sidecar binaries (macOS ARM64)
        run: |
          brew install ffmpeg tesseract

          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin

          cp "$(brew --prefix tesseract)/bin/tesseract" src-tauri/binaries/tesseract-aarch64-apple-darwin
          chmod +x src-tauri/binaries/tesseract-aarch64-apple-darwin

          mkdir -p src-tauri/binaries/tessdata
          cp "$(brew --prefix tesseract)/share/tessdata/eng.traineddata" src-tauri/binaries/tessdata/

      - name: Build Tauri (macOS ARM64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Snapzy ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

  # ============================================================
  # macOS - Intel (x86_64)
  # ============================================================
  build-macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Install sidecar binaries (macOS x64)
        run: |
          brew install ffmpeg tesseract

          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-x86_64-apple-darwin

          cp "$(brew --prefix tesseract)/bin/tesseract" src-tauri/binaries/tesseract-x86_64-apple-darwin
          chmod +x src-tauri/binaries/tesseract-x86_64-apple-darwin

          mkdir -p src-tauri/binaries/tessdata
          cp "$(brew --prefix tesseract)/share/tessdata/eng.traineddata" src-tauri/binaries/tessdata/

      - name: Build Tauri (macOS x64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Snapzy ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-apple-darwin

  # ============================================================
  # Windows (x86_64)
  # ============================================================
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Install sidecar binaries (Windows x64)
        shell: pwsh
        run: |
          mkdir -Force src-tauri\binaries

          # Install FFmpeg via chocolatey (pre-installed on GitHub runners)
          choco install ffmpeg --yes --no-progress

          # Copy ffmpeg.exe
          $ffmpegPath = (Get-Command ffmpeg -ErrorAction Stop).Source
          Copy-Item $ffmpegPath "src-tauri\binaries\ffmpeg-x86_64-pc-windows-msvc.exe"

          # Download Tesseract portable (no installer needed)
          $tesseractZip = "$env:TEMP\tesseract.zip"
          Invoke-WebRequest -Uri "https://github.com/UB-Mannheim/tesseract/releases/download/v5.5.0/tesseract-ocr-w64-setup-5.5.0.20241111.exe" -OutFile $tesseractZip

          # Extract tessdata from the installer using 7zip
          $tessDir = "$env:TEMP\tesseract-extract"
          mkdir -Force $tessDir
          & "C:\Program Files\7-Zip\7z.exe" x $tesseractZip -o"$tessDir" -y

          # Copy tesseract.exe from extracted dir
          $tesseractExe = Get-ChildItem -Path $tessDir -Recurse -Name "tesseract.exe" | Select-Object -First 1
          if ($tesseractExe) {
            Copy-Item "$tessDir\$tesseractExe" "src-tauri\binaries\tesseract-x86_64-pc-windows-msvc.exe"
          }

          # Copy tessdata
          mkdir -Force src-tauri\binaries\tessdata
          $tessdata = Get-ChildItem -Path $tessDir -Recurse -Name "eng.traineddata" | Select-Object -First 1
          if ($tessdata) {
            Copy-Item "$tessDir\$tessdata" "src-tauri\binaries\tessdata\"
          }

      - name: Build Tauri (Windows x64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Snapzy ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

  # ============================================================
  # Linux (x86_64)
  # ============================================================
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            ffmpeg \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Install dependencies
        run: npm ci

      - name: Install sidecar binaries (Linux x64)
        run: |
          # Copy system FFmpeg
          cp "$(which ffmpeg)" src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu

          # Copy system Tesseract
          cp "$(which tesseract)" src-tauri/binaries/tesseract-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/tesseract-x86_64-unknown-linux-gnu

          # Copy tessdata
          mkdir -p src-tauri/binaries/tessdata
          cp /usr/share/tesseract-ocr/*/tessdata/eng.traineddata src-tauri/binaries/tessdata/ 2>/dev/null || \
          cp /usr/share/tesseract-ocr/tessdata/eng.traineddata src-tauri/binaries/tessdata/ 2>/dev/null || true

      - name: Build Tauri (Linux x64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Snapzy ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-unknown-linux-gnu
