name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  # ============================================================
  # macOS - Apple Silicon (aarch64)
  # ============================================================
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Install sidecar binaries (macOS ARM64)
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ffmpeg tesseract

          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin

          cp "$(brew --prefix tesseract)/bin/tesseract" src-tauri/binaries/tesseract-aarch64-apple-darwin
          chmod +x src-tauri/binaries/tesseract-aarch64-apple-darwin

          mkdir -p src-tauri/binaries/tessdata
          cp "$(brew --prefix tesseract)/share/tessdata/eng.traineddata" src-tauri/binaries/tessdata/

      - name: Build Tauri (macOS ARM64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Snapzy ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

  # ============================================================
  # macOS - Intel (x86_64)
  # ============================================================
  build-macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Install sidecar binaries (macOS x64)
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ffmpeg tesseract

          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-x86_64-apple-darwin

          cp "$(brew --prefix tesseract)/bin/tesseract" src-tauri/binaries/tesseract-x86_64-apple-darwin
          chmod +x src-tauri/binaries/tesseract-x86_64-apple-darwin

          mkdir -p src-tauri/binaries/tessdata
          cp "$(brew --prefix tesseract)/share/tessdata/eng.traineddata" src-tauri/binaries/tessdata/

      - name: Build Tauri (macOS x64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Snapzy ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-apple-darwin

  # ============================================================
  # Windows (x86_64)
  # ============================================================
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Install sidecar binaries (Windows x64)
        shell: pwsh
        run: |
          mkdir -Force src-tauri\binaries

          # Install FFmpeg and Tesseract via chocolatey
          choco install ffmpeg tesseract --yes --no-progress

          # Refresh PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          # Copy ffmpeg.exe
          $ffmpegPath = (Get-Command ffmpeg -ErrorAction Stop).Source
          Copy-Item $ffmpegPath "src-tauri\binaries\ffmpeg-x86_64-pc-windows-msvc.exe"

          # Copy tesseract.exe
          $tesseractPath = (Get-Command tesseract -ErrorAction Stop).Source
          Copy-Item $tesseractPath "src-tauri\binaries\tesseract-x86_64-pc-windows-msvc.exe"

          # Copy tessdata - try multiple locations
          mkdir -Force src-tauri\binaries\tessdata
          $tessFound = $false
          $tessSearchPaths = @(
            (Join-Path (Split-Path $tesseractPath -Parent) "tessdata"),
            "C:\Program Files\Tesseract-OCR\tessdata",
            "C:\ProgramData\chocolatey\lib\tesseract\tools\tessdata",
            "C:\ProgramData\chocolatey\lib\tesseract\tools\share\tessdata"
          )
          foreach ($p in $tessSearchPaths) {
            if (Test-Path (Join-Path $p "eng.traineddata")) {
              Write-Host "Found tessdata at: $p"
              Copy-Item "$p\eng.traineddata" "src-tauri\binaries\tessdata\"
              $tessFound = $true
              break
            }
          }
          if (-not $tessFound) {
            Write-Host "Downloading eng.traineddata from GitHub..."
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata" -OutFile "src-tauri\binaries\tessdata\eng.traineddata"
          }

          # Verify files
          Write-Host "=== binaries directory contents ==="
          Get-ChildItem src-tauri\binaries\ -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: Build Tauri (Windows x64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Snapzy ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

  # ============================================================
  # Windows (aarch64)
  # ============================================================
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Install sidecar binaries (Windows ARM64)
        shell: pwsh
        run: |
          mkdir -Force src-tauri\binaries

          # Install FFmpeg and Tesseract via chocolatey (native ARM64)
          choco install ffmpeg tesseract --yes --no-progress

          # Refresh PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          # Copy ffmpeg.exe
          $ffmpegPath = (Get-Command ffmpeg -ErrorAction Stop).Source
          Copy-Item $ffmpegPath "src-tauri\binaries\ffmpeg-aarch64-pc-windows-msvc.exe"

          # Copy tesseract.exe
          $tesseractPath = (Get-Command tesseract -ErrorAction Stop).Source
          Copy-Item $tesseractPath "src-tauri\binaries\tesseract-aarch64-pc-windows-msvc.exe"

          # Copy tessdata - try multiple locations
          mkdir -Force src-tauri\binaries\tessdata
          $tessFound = $false
          $tessSearchPaths = @(
            (Join-Path (Split-Path $tesseractPath -Parent) "tessdata"),
            "C:\Program Files\Tesseract-OCR\tessdata",
            "C:\ProgramData\chocolatey\lib\tesseract\tools\tessdata",
            "C:\ProgramData\chocolatey\lib\tesseract\tools\share\tessdata"
          )
          foreach ($p in $tessSearchPaths) {
            if (Test-Path (Join-Path $p "eng.traineddata")) {
              Write-Host "Found tessdata at: $p"
              Copy-Item "$p\eng.traineddata" "src-tauri\binaries\tessdata\"
              $tessFound = $true
              break
            }
          }
          if (-not $tessFound) {
            Write-Host "Downloading eng.traineddata from GitHub..."
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata" -OutFile "src-tauri\binaries\tessdata\eng.traineddata"
          }

          # Verify files
          Write-Host "=== binaries directory contents ==="
          Get-ChildItem src-tauri\binaries\ -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: Build Tauri (Windows ARM64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Snapzy ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-pc-windows-msvc
